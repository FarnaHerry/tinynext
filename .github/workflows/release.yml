# release.yml — build TinyNext on Windows / Linux / macOS and publish a GitHub
# Release on every `v*` tag.
#
#   * `mcpp` is installed from the official one-line script (→ ~/.mcpp).
#   * The aria2-next engine binary is downloaded per-platform from the
#     AnInsomniacy/aria2-next v2.5.5 release and verified against
#     engines/checksums.sha256 before packaging.
#   * Packaging: Windows → make-win-pkg.ps1 (zip + NSIS setup.exe), Linux →
#     make-linux-pkg.sh (tar.gz + .deb + .rpm), macOS → make-dist.sh (tar.gz).
#
# NOTE: local dev is on Linux; the Windows / macOS jobs are verified by CI
# itself. Expect POSIX-specific fixes to surface on the failing job.
#
# NOTE: Intel macOS (macos-x86_64) is NOT built here — the official mcpp
# install.sh only ships linux-x86_64 / linux-aarch64 / macosx-arm64 binaries.
# Add a macos-13 runner back once the macosx-x64 mcpp binary (or a subos
# install on macOS) is verified.
#
# Manual iteration without a tag: use the "workflow_dispatch" trigger (builds
# and uploads artifacts only; the Release is created only for tag pushes).

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # —— 瘦身 ffmpeg（0.5.2）：编译只留合并所需的最小静态版，替代 108MB 完整包 ----
  # 完整静态 ffmpeg（BtbN/gyan）单文件 ~100MB，塞进安装包太夸张。我们只做 DASH
  # 音视频合并（-c:v copy -c:a copy|aac），不需要任何 GPL 编码器（无 libx264/
  # libmp3lame）。用 --disable-everything + LGPL 编出 ~6-15MB 单二进制，从源码
  # 三平台各编一次。
  #
  # 产物作为 artifact 上传，供 build job 拉取（也可以用 workflow_dispatch 手动
  # 触发单独验证体积/耗时）。
  trim-ffmpeg:
    name: trim-ffmpeg-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win64
            os: windows-latest
            out: ffmpeg.exe
          - name: linux-x64
            os: ubuntu-latest
            out: ffmpeg
          - name: macos-arm64
            os: macos-latest
            out: ffmpeg
    steps:
      - uses: actions/checkout@v7

      # 共用 configure 参数（Windows 额外 --enable-cross-compile --target-os=mingw32，
      # 由下面的 shell 分支拼进去）。
      - name: "Setup msys2 (Windows)"
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm
            make
            diffutils

      - name: Build trimmed ffmpeg (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y nasm yasm
          fi
          bash .github/workflows/trim-ffmpeg.sh \
            "${{ runner.os }}" "${{ matrix.out }}"

      - name: Build trimmed ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bash .github/workflows/trim-ffmpeg.sh \
            "Windows" "${{ matrix.out }}"

      - name: Upload trimmed ffmpeg artifact
        uses: actions/upload-artifact@v7
        with:
          name: trimmed-ffmpeg-${{ matrix.name }}
          path: engines/${{ matrix.out }}
          if-no-files-found: error

  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 不加 needs：build（编主程序）与 trim-ffmpeg（编 ffmpeg）并行跑，各自 ~2min /
    # ~10min。真正要两者都就绪的是下面的 package job。
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install mcpp (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://github.com/mcpp-community/mcpp/releases/latest/download/install.sh | bash
          echo "$HOME/.mcpp/bin" >> "$GITHUB_PATH"

      - name: Install mcpp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 官方 install.sh 只支持 linux/mac，Windows 走 xlings/subos。
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          # 当前进程的 PATH 不会自动刷新，用全路径调用 xlings。
          # 先刷包索引，再钉住 mcpp@2026.8.16.1（与本地一致）：mcpp.toml 的
          # [resources]（版本信息/图标直接嵌入 PE，见 mcpp.toml 注释）需要
          # mcpp ≥ 2026.8.7.1，xlings 索引滞后时默认解析会装到旧版，导致 CI 打出的
          # exe 缺版本信息（本地 2026.8.16.1 正常）。Linux/macOS 走 install.sh 的
          # latest（≥ 2026.8.16.1）且 [resources] 仅 PE 生效，无需钉版。
          & "$env:USERPROFILE\.xlings\bin\xlings.exe" update
          & "$env:USERPROFILE\.xlings\bin\xlings.exe" install mcpp@2026.8.16.1 -y
          # mcpp 装到 subos/default/bin；写入 GITHUB_PATH 供后续步骤使用。
          "$env:USERPROFILE\.xlings\subos\default\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache mcpp toolchain
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~/.xlings' || '~/.mcpp' }}
          key: mcpp-${{ runner.os }}-${{ hashFiles('mcpp.lock', 'mcpp.toml') }}

      - name: Refresh package index (defensive)
        shell: bash
        run: |
          # mcpp/xlings 的包索引可能滞后（曾因索引缺 eui-neo 某版本导致拉包失败）。
          # 索引刷新失败不致命——若本地已有完整索引，mcpp build 仍能继续。
          if command -v xlings >/dev/null 2>&1; then
            xlings update || echo "xlings update failed — continuing with existing index"
          else
            echo "xlings not found — skipping index refresh"
          fi

      - name: Install NSIS (Windows packaging)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 完整版 NSIS（含 Modern UI 2 / 语言文件）。curl 下载官方 3.10 zip（本地验证
          # 可用；IWR + SourceForge 重定向在 CI 上不稳定），Expand-Archive 解压后进 PATH。
          curl.exe -fsSL --retry 3 --retry-delay 5 -o "$env:RUNNER_TEMP\nsis.zip" "https://sourceforge.net/projects/nsis/files/NSIS%203/3.10/nsis-3.10.zip/download"
          if (-not (Test-Path "$env:RUNNER_TEMP\nsis.zip")) { throw "nsis.zip download failed" }
          Expand-Archive -Path "$env:RUNNER_TEMP\nsis.zip" -DestinationPath "$env:RUNNER_TEMP\nsis" -Force
          if (-not (Test-Path "$env:RUNNER_TEMP\nsis\nsis-3.10\makensis.exe")) { throw "NSIS extract failed" }
          "$env:RUNNER_TEMP\nsis\nsis-3.10" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install rpm (Linux packaging)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build release
        run: mcpp build --release

      - name: Stage compiled exe (locate via latest target, in-job reliable)
        shell: bash
        run: |
          set -euo pipefail
          bin="$(ls -dt target/*/*/bin | head -1)"
          src="$(find "$bin" -maxdepth 1 -name 'tinynext*' -type f | head -1)"
          [ -n "$src" ] || { echo "compiled binary not found in $bin" >&2; exit 1; }
          mkdir -p dist-src
          # 保留平台扩展名：Windows 拷贝为 tinynext.exe（ci-package.ps1 期望），
          # unix 拷贝为 tinynext。
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$src" dist-src/tinynext.exe
          else
            cp "$src" dist-src/tinynext
          fi
          ls -lh dist-src/

      - name: Upload compiled exe
        uses: actions/upload-artifact@v7
        with:
          # 只传编译好的主程序 exe（不再传易错的整个 target/ 多 hash 目录，
          # 也不在 build 阶段 fetch engines——引擎由 package job 统一就位）。
          name: build-${{ matrix.name }}
          path: dist-src/
          if-no-files-found: error

  # —— package：等 build（主程序 exe）与 trim-ffmpeg（ffmpeg）都就绪后统一打包 ----
  # build 和 trim-ffmpeg 并行跑，package 串在两者之后：总时长 ≈ max(build≈2min,
  # ffmpeg≈10min) + 打包≈3min。编译只在 build job 发生一次；本 job 用专门的
  # ci-package 脚本（no-compile）组装，不重复编译、不遍历易错的 target/。
  package:
    name: package-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [build, trim-ffmpeg]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win64
            os: windows-latest
            os_id: win
            arch: win64
            engine_asset: aria2-next-2.5.5-windows-x86_64.exe
            engine_file: engines/aria2-next.exe
            ytdlp_asset: yt-dlp.exe
            ytdlp_file: engines/yt-dlp.exe
            pkg_glob: tinynext-v*
          - name: linux-x64
            os: ubuntu-latest
            os_id: linux
            arch: x86_64
            engine_asset: aria2-next-2.5.5-linux-x86_64
            engine_file: engines/aria2-next
            ytdlp_asset: yt-dlp_linux
            ytdlp_file: engines/yt-dlp
            pkg_glob: tinynext-v*
          - name: macos-arm64
            os: macos-latest
            os_id: macos
            arch: arm64
            engine_asset: aria2-next-2.5.5-macos-arm64
            engine_file: engines/aria2-next
            ytdlp_asset: yt-dlp_macos
            ytdlp_file: engines/yt-dlp
            pkg_glob: tinynext-v*.tar.gz
    steps:
      - uses: actions/checkout@v7

      - name: Download compiled exe (from build job)
        uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.name }}
          path: dist-src

      - name: Download trimmed ffmpeg
        uses: actions/download-artifact@v8
        with:
          name: trimmed-ffmpeg-${{ matrix.name }}
          path: engines

      - name: Fetch aria2-next engine (checksum-verified)
        shell: bash
        run: |
          mkdir -p engines
          curl -fL -o "engines/${{ matrix.engine_asset }}" \
            "https://github.com/AnInsomniacy/aria2-next/releases/download/v2.5.5/${{ matrix.engine_asset }}"
          tr -d '\r' < engines/checksums.sha256 > engines/checksums.tmp
          mv engines/checksums.tmp engines/checksums.sha256
          (cd engines && sha256sum -c checksums.sha256 --ignore-missing) || {
            echo "aria2-next checksum mismatch — aborting" >&2; exit 1; }
          mv "engines/${{ matrix.engine_asset }}" "${{ matrix.engine_file }}"
          chmod +x "${{ matrix.engine_file }}"

      - name: Fetch yt-dlp engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "${{ matrix.ytdlp_asset }}" \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/${{ matrix.ytdlp_asset }}"
          chmod +x "${{ matrix.ytdlp_asset }}"
          mv "${{ matrix.ytdlp_asset }}" "${{ matrix.ytdlp_file }}"

      - name: Make ffmpeg executable (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x engines/ffmpeg

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 --retry-delay 5 -o "$env:RUNNER_TEMP\nsis.zip" "https://sourceforge.net/projects/nsis/files/NSIS%203/3.10/nsis-3.10.zip/download"
          if (-not (Test-Path "$env:RUNNER_TEMP\nsis.zip")) { throw "nsis.zip download failed" }
          Expand-Archive -Path "$env:RUNNER_TEMP\nsis.zip" -DestinationPath "$env:RUNNER_TEMP\nsis" -Force
          if (-not (Test-Path "$env:RUNNER_TEMP\nsis\nsis-3.10\makensis.exe")) { throw "NSIS extract failed" }
          "$env:RUNNER_TEMP\nsis\nsis-3.10" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install rpm (Linux packaging)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      # —— 打包（no-compile）：用 ci-package 脚本从已就位 exe + engines 组装，不重复编译 ----
      - name: Package tar.gz + stage dist (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash packaging/ci-package.sh "${{ matrix.os_id }}" "${{ matrix.arch }}" dist-src/tinynext

      - name: Build .deb / .rpm (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="$(grep -m1 '^version' mcpp.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          bash packaging/build-deb.sh "$version"
          bash packaging/build-rpm.sh "$version"

      - name: Package zip + NSIS setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # ci-package.ps1：从已就位 exe + engines 组装 dist\ + tinynext-v*-win64.zip
          # （不编译、不读 target/.build_cache）。
          & "packaging/ci-package.ps1" "dist-src/tinynext.exe"
          $versionLine = Get-Content mcpp.toml | Where-Object { $_ -match '^\s*version\s*=\s*"' } | Select-Object -First 1
          $version = $versionLine -replace '^\s*version\s*=\s*"([^"]+)".*', '$1'
          # NSIS 安装包：tinynext.nsi 用 ..\dist\*（相对 packaging/），从仓库根跑 makensis。
          makensis "/DAPP_VERSION=$version" "$env:GITHUB_WORKSPACE\packaging\tinynext.nsi"
          Get-ChildItem "$env:GITHUB_WORKSPACE\tinynext-v$version-win64*" | Select-Object Name,Length

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          # 用 pkg- 前缀：release job 只下载 pkg-* 的安装包，避免混入 build-*/
          # trimmed-ffmpeg-* 的中间产物（exe、engines/ 裸二进制）。
          name: pkg-${{ matrix.name }}
          path: ${{ matrix.pkg_glob }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          # 只拿 package job 上传的 pkg-* 安装包，过滤 build-*/trimmed-ffmpeg-*
          # 的中间产物，避免 release 混进裸二进制（mac/linux/win 各自区分）。
          pattern: 'pkg-*'
          merge-multiple: true

      - name: Publish Release
        # v3 = node24 运行时（v2 还在 node20，已淘汰）。tag_name/name/draft/body/files
        # 输入与 v2 兼容；draft: true 语义不变（创建 draft release，人工发布）。
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: TinyNext ${{ github.ref_name }}
          draft: true
          body: |
            ## TinyNext ${{ github.ref_name }}

            **安装包**：
            - **Windows**: `tinynext-v*-win64-setup.exe`（NSIS 安装向导，per-user 装到
              `%LOCALAPPDATA%\Programs\TinyNext`；未签名，SmartScreen 可能提示）
            - **Linux x64**: `tinynext-v*-linux-x86_64.deb` / `tinynext-v*-linux-x86_64.rpm`
              （需 glibc ≥ 2.39 且桌面环境有 Mesa/GLX）

            **免安装版**（解压即用）：
            - **Windows**: `tinynext-v*-win64.zip`
            - **Linux x64**: `tinynext-v*-linux-x86_64.tar.gz`（内含 `run.sh` 启动脚本）
            - **macOS Apple Silicon**: `tinynext-v*-macos-arm64.tar.gz`（暂未做 dmg）

            下载引擎 `aria2-next`（分片多连接、断点续传、磁力/BT）与视频依赖
            `yt-dlp` + `ffmpeg`（视频解析 / DASH 合并）均已随包附带。
            设置页可修改下载路径、主题与 aria2 参数（并发/代理/重试/限速等）。
          files: artifacts/*
